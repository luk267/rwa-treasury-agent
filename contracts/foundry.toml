[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]

solc = "0.8.38"
optimizer = true
optimizer_runs = 200
evm_version = "osaka"
# solc 0.8.38 warns 58 times that forge-std's Vm.sol uses `error` as a parameter name
# (Warning 6335). Hide warnings from forge-std only; our own code and OpenZeppelin still warn.
ignored_warnings_from = ["lib/forge-std"]
# Write the AST into the artifacts: agent/src/abi.test.ts reads enum RejectReason from it.
# This changes the build output only, not the bytecode.
ast = true

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
# A handler call that reverts is skipped, not failed. That includes a failed assert inside the
# handler, so VaultHandler counts failed checks and an invariant reads the count.
fail_on_revert = false

# Values come from the environment or contracts/.env, never from this file.
[rpc_endpoints]
sepolia = "${RPC_URL_SEPOLIA}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

# See https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
